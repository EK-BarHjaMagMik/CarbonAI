<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarbonAI — Sustainable Travel Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=2.0">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="container">
            <div class="d-flex align-items-center gap-2">
                <span class="header-icon">🌿</span>
                <div>
                    <h1 class="mb-0">CarbonAI</h1>
                    <p class="mb-0 header-sub">Sustainable Travel Advisor</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4">

        <!-- Input Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="card-title h5 mb-3">Plan Your Trip</h2>
                <form id="tripForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="fromCity" class="form-label">From</label>
                            <input type="text" class="form-control" id="fromCity" placeholder="e.g. Copenhagen" required>
                        </div>
                        <div class="col-md-4">
                            <label for="toCity" class="form-label">To</label>
                            <input type="text" class="form-control" id="toCity" placeholder="e.g. Paris" required>
                        </div>
                        <div class="col-md-2">
                            <label for="passengers" class="form-label">Passengers</label>
                            <input type="number" class="form-control" id="passengers" value="1" min="1" max="99" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100" id="analyzeBtn">
                                <span id="btnText">Analyze</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="alert alert-danger d-none" role="alert">
            <strong>Error:</strong> <span id="errorMessage"></span>
        </div>

        <!-- Results Section (hidden until response) -->
        <div id="results" class="d-none">

            <!-- Summary Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div class="summary-card">
                        <div class="summary-label">Distance</div>
                        <div class="summary-value" id="summaryDistance">—</div>
                        <div class="summary-unit">km (straight-line)</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card summary-card--green">
                        <div class="summary-label">Lowest CO₂</div>
                        <div class="summary-value" id="summaryLowest">—</div>
                        <div class="summary-unit">kg CO₂e</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="summary-card summary-card--red">
                        <div class="summary-label">Highest CO₂</div>
                        <div class="summary-value" id="summaryHighest">—</div>
                        <div class="summary-unit">kg CO₂e</div>
                    </div>
                </div>
            </div>

            <!-- Transport Modes -->
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <h2 class="card-title h5 mb-3">Transport Modes</h2>
                    <div id="modesContainer"></div>
                </div>
            </div>

            <!-- AI Recommendation -->
            <div class="card shadow-sm mb-4">
                <div class="card-body p-4">
                    <h2 class="card-title h5 mb-3">AI Recommendation</h2>
                    <div id="aiRecommendation" class="ai-box"></div>
                </div>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
